# Tests the app, builds it and uploads it to App Store Connect (TestFlight) whenever a
# push to main changes the app, then tags the commit v<version>-build<N> and
# publishes a GitHub Release. If docs/appstore/whats-new/<version>.txt exists and that
# version hasn't gone to Apple yet, it also submits the build for App Review
# (Tools/submit-for-review.rb). Run it by hand from the Actions tab too.
#
# Needs three repository secrets from an App Store Connect API key (Admin role,
# so Xcode can manage signing in the cloud): ASC_KEY_ID, ASC_ISSUER_ID and
# ASC_KEY_P8 (the contents of the AuthKey_XXXX.p8 file). See README → Releasing.
name: Release

on:
  push:
    branches: [main]
    paths:
      - 'HarleyChipTracker/**'
      - 'Config/**'
      - 'HarleyChipTracker.xcodeproj/**'
  workflow_dispatch:

# One release at a time, so build numbers never collide.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 90 # Apple can take a while to process a build before it can be submitted
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      HAS_KEY: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8 != '' }}
      ARCHIVE: ${{ github.workspace }}/../build/HarleyChipTracker.xcarchive
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release tags decide the build number

      - name: Pick the build number
        id: build
        run: |
          xcodebuild -version
          echo "number=$(Tools/next-build-number.sh)" >> "$GITHUB_OUTPUT"

      - name: Compile only (no App Store Connect key yet)
        if: env.HAS_KEY != 'true'
        run: |
          xcodebuild archive -project HarleyChipTracker.xcodeproj -scheme HarleyChipTracker \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" CODE_SIGNING_ALLOWED=NO -quiet
          echo "::error title=No App Store Connect key::The app compiles, but nothing was uploaded. Add the ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 repository secrets (README → Releasing), then re-run this workflow."
          exit 1

      - name: Install the App Store Connect key
        if: env.HAS_KEY == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          chmod 600 "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      # A build that fails a test (above all the upgrade-safety ones) never reaches TestFlight.
      - name: Run the tests
        if: env.HAS_KEY == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          simulator=$(xcrun simctl list devices available | grep -m1 -E '^ +iPhone' | grep -oE '[0-9A-F]{8}-[0-9A-F-]{27}')
          [ -n "$simulator" ] || { echo "::error::No iPhone simulator on this runner."; exit 1; }
          # Signed like a local build: without the iCloud entitlement the app can't launch to host the tests.
          xcodebuild test -project HarleyChipTracker.xcodeproj -scheme HarleyChipTracker \
            -destination "platform=iOS Simulator,id=$simulator" -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" -quiet

      - name: Archive build ${{ steps.build.outputs.number }}
        if: env.HAS_KEY == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive -project HarleyChipTracker.xcodeproj -scheme HarleyChipTracker \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="${{ steps.build.outputs.number }}" -quiet

      - name: Check the iCloud entitlements made it in
        if: env.HAS_KEY == 'true'
        run: |
          codesign -d --entitlements - --xml "$ARCHIVE/Products/Applications/HarleyChipTracker.app" > "$RUNNER_TEMP/entitlements.plist"
          grep -q 'iCloud.com.nikhilmath.HarleyChipTracker' "$RUNNER_TEMP/entitlements.plist" \
            || { echo "::error::The archive is missing the iCloud container entitlement; not uploading."; exit 1; }

      - name: Upload to App Store Connect
        if: env.HAS_KEY == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive -archivePath "$ARCHIVE" \
            -exportOptionsPlist Config/ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Publish the GitHub Release
        if: env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Tools/github-release.sh "${{ steps.build.outputs.number }}" "$GITHUB_SHA"

      # Last, so a build that can't be submitted is still on TestFlight and tagged.
      - name: Submit for App Review (only with a What's New file for this version)
        if: env.HAS_KEY == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          version=$(grep -m1 -o 'MARKETING_VERSION = [0-9.]*' HarleyChipTracker.xcodeproj/project.pbxproj | grep -o '[0-9.]*$')
          ruby Tools/submit-for-review.rb --self-test
          ruby Tools/submit-for-review.rb "$version" "${{ steps.build.outputs.number }}"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
